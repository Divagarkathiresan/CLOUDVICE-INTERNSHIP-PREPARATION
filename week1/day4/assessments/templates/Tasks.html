<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks Page</title>
</head>
<body>
    <h3>Task List</h3>
    <ol>
        {% for task in tasks %}
            <li>
                {{ task[1] }} — {{ task[2] }}
            </li>
        {% else %}
            <li>No tasks added yet.</li>
        {% endfor %}
    </ol>
</body>
</html>
