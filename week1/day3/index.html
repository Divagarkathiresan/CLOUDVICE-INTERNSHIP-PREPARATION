    <button id="btn"> give message to backend</button>
    <div>
        <input type="text" id="txt"/>
        <button id="print-txt">print text</button>
    </div>

    <br>
    <br>
    <h3>Forms</h3>
    <br>
    
    <form id="form">
        <div>
            <label for="email">Email</label>
            <input type="email" placeholder="enter the email" id="email"/>
        </div>
        <div>
            <label> password</label>
            <input type="password" placeholder="enter the password" id="password"/>
        </div>
        <button type="submit" id="submit-btn" onclick="alert('The button is clicked')">submit</button>
    </form>

    <h1 id="visi-txt">Visible</h1>
    <button id="toggle-btn">hide</button>

    <h1 id="count-h1"><span id="count">0</span></h1>
    <button id="count-btn">increase</button>

    <h1 id="ajax-content">Ajax content</h1>
    <button id="ajax-btn">Tap to see the content</button>
</body>

<script>

    let count =0
    function clicked(){
        console.log("Clicked")
    }
    document.getElementById("btn").addEventListener("click",clicked)
    
    const message = document.querySelector("#txt")
    function printText(){
        console.log(message.value)
    }
    document.getElementById("print-txt").addEventListener("click",printText)


    const email = document.querySelector("#email")
    function getMail(event){
        event.preventDefault()
        console.log(email.value)
    }

    document.getElementById("form").addEventListener("submit",getMail)


    
    const getDetails = function(event){

        event.preventDefault()

        const email1 = document.getElementById("email").value
        const password = document.getElementById("password").value

        const data = {
            
            email : email1,
            password : password
        }
        console.log(data)
    }
    document.getElementById("form").addEventListener("submit",getDetails)


    const increaseCount=function(){
        count++
        document.getElementById("count").textContent=count
    }
    document.getElementById("count-btn").addEventListener("click",increaseCount)

    //j query
    $("#toggle-btn").click(function(){
        $("#visi-txt").toggle();

        if ($("#visi-txt").is(":visible")) {
            $(this).text("Hide");
        } else {
            $(this).text("Show");
        }
    });

    $('#ajax-btn').click(function(){
        $("#ajax-content").toggle()
        $("#ajax-content").load("/day2/assessments/sample.txt")
    })
    
</script>
