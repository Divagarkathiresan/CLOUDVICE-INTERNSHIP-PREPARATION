<body>
    <div class="container text-center mt-5">
        <h2>Welcome to the website</h2>
    </div>  
    <form id="form" class="container mt-5 p-4 border rounded shadow bg-light" style="max-width:450px;">
        <div id="h3-id" class="text-center mb-3">
            <h3 class="bg-warning-subtle p-3 rounded">Registration Form</h3>
        </div>
        <div id="name-div" class="mb-3">
            <label for="name" class="form-label">name : </label>
            <input type="text" id="name" class="form-control" placeholder="Enter your name" required/>
        </div>
        <div id="email-div" class="mb-3">
            <label for="email" class="form-label">email : </label>
            <input type="email" id="email" class="form-control" placeholder="Enter your email" required/>
        </div>
        <div id="age-div" class="mb-3">
            <label for="age" class="form-label">age : </label>
            <input type="number" id="age" class="form-control" placeholder="Enter your age"/>
        </div>
        <div id="password-div" class="mb-3">
            <label for="password" class="form-label">password : </label>
            <input type="password" id="password" class="form-control" placeholder="Enter your password"/>
        </div>
        <div id="btn-div" class="text-center d-flex gap-2">
            <button class="btn btn-secondary flex-fill" type="submit" id="submit-btn">submit</button>
            <button class="btn btn-outline-secondary flex-fill" type="reset">reset</button>
        </div>
    </form>
    <div class="container text-center mt-5">
        <h2>Copy rights received</h2>
    </div>  
</body>

    $(document).ready(function(){
    $("#form").on("submit",function(event){

        event.preventDefault()

        const age=Number($("#age").val())
        const password=$("#password").val()
        if(age<=0 || age>=100){
            alert("Age is invalid")
            return
        }
        if(password.length < 6){
            alert("Password is invalid")
            return
        }

        alert("Registered")

        $("#form")[0].reset();
